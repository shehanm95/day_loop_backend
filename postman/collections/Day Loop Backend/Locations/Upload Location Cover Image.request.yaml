$kind: http-request
name: Upload Location Cover Image
method: POST
url: '{{baseUrl}}/api/v1/locations/{{locationId}}/cover-image'
order: 10000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
body:
  type: formdata
  content:
    - key: file
      type: file
      src: ''
